[project]
name = "symptomscout-versions"
version = "0.1.0"
description = "SymptomScout in three tiers — crawl / walk / run — to compare side by side"
requires-python = ">=3.11"
dependencies = [
    "anthropic>=0.40",
    "streamlit>=1.30",
    "python-dotenv>=1.0",
    "httpx>=0.27",
    "watchdog>=6.0.0",
    "pytest>=8.0",
]

[tool.uv]
package = false

[dependency-groups]
# pytest-xdist powers the parallel Phase-A eval run (`pytest -n auto`) in
# run-plus/ralph.sh — runs the 5 text evals concurrently for the A10 recording.
# uv syncs the `dev` group by default, so `uv run` picks it up.
dev = ["pytest-xdist>=3.6"]
